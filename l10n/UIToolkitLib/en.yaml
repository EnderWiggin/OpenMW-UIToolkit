# -------------- Menu Settings --------------
SettingPageName: UI Toolkit
SettingPageDesc: |-
  Version: {version}
  API: {api}  Tooltips: {tooltips}

# -------------- Interface Settings --------------
InterfaceSettingsName: Interface Settings
InterfaceSettingsDesc: Configure how things look.

SettingNumberSeparatorsName: Show thousand separators
SettingNumberSeparatorsDesc: |-
  {color_header}None{color_normal}    :   1234567.89
  {color_header}Space{color_normal}   : 1 234 567.89
  {color_header}Comma{color_normal} : 1,234,567.89
ConfigNumberSeparators_None: None
ConfigNumberSeparators_Comma: Comma
ConfigNumberSeparators_Space: Space

SettingScaleScrollbarWidthWithTextName: Scale scrollbar width with text size
SettingScaleScrollbarWidthWithTextDesc: |-
  Scrollbar width will be proportionally scaled as text size increases or decreases.
  Useful if you don't want to increase UI scaling but need bigger text and scrollbar to see better. Or smaller to better fit the screen.

# -------------- Controller Settings --------------
ControllerSettingsName: Controller Settings
ControllerSettingsDesc: |-
  Configure UI Toolkit controller settings.

SettingRepeatingButtons: Repeating Buttons
SettingRepeatingButtonsDesc: Allows to repeat controller button input while held.

SettingRepeatingButtonsThreshold: Repeat Threshold
SettingRepeatingButtonsThresholdDesc: |-
  How long (in seconds) to hold the button until repetition starts.
  Should not be lower than {color_header}Repeat Interval{color_normal}.
  Range is [{color_header}{min}{color_normal} - {color_header}{max}{color_normal}], default is {color_header}{default}{color_normal} seconds.

SettingRepeatingButtonsStep: Repeat Interval
SettingRepeatingButtonsStepDesc: |-
  How often (in seconds) button actions repeat.
  Should not be higher than {color_header}Repeat Threshold{color_normal}.
  Range is [{color_header}{min}{color_normal} - {color_header}{max}{color_normal}], default is {color_header}{default}{color_normal} seconds.